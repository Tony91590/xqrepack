name: CI

on: pus

jobs:
  build:

    runs-on: ubuntu-latest
      
    steps:
    - uses: actions/checkout@main
    - name: apt update
      run: sudo apt update
    - name: apt install
      run: sudo apt install -y liblzo2-dev mtd-utils squashfs-tools fakeroot
    - name: pip upgrade
      run: python -m pip install --upgrade pip
    - name: pip install
      run: pip install python-lzo ubi_reader
    - name: make
      run: make

    - uses: actions/upload-artifact@main
      with:
        name: miwifi_rd23_all_0904d_1.0.104_INT_SSH.bin
        path: miwifi_rd23_all_0904d_1.0.104_INT_SSH.bin
